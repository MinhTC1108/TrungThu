<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trung Thu 3D</title>

  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./css.css">

  <script>
    // Các ảnh trong repository nằm ở thư mục gốc, còn script cũ có thể
    // vẫn tạo URL ./assets/.... Chuyển URL trước khi trình duyệt tải ảnh.
    (() => {
      const nativeSrcDescriptor = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
      if (!nativeSrcDescriptor || !nativeSrcDescriptor.set) return;

      Object.defineProperty(HTMLImageElement.prototype, 'src', {
        configurable: nativeSrcDescriptor.configurable,
        enumerable: nativeSrcDescriptor.enumerable,
        get: nativeSrcDescriptor.get,
        set(value) {
          const source = String(value).replace(/\/assets\//g, '/');
          nativeSrcDescriptor.set.call(this, source);
        }
      });
    })();
  </script>
</head>
<body>
  <div id="webgl-container"></div>

  <div class="top-bar">
    <button class="icon-btn" id="audio-btn" title="Bật/Tắt Nhạc"><i class="fas fa-music"></i></button>
    <button class="icon-btn" id="reset-cam-btn" title="Góc nhìn ban đầu"><i class="fas fa-compress-arrows-alt"></i></button>
  </div>

  <div class="click-hint">Chạm vào lồng đèn nhé</div>

  <div class="wish-modal" id="wishModal">
    <div class="wish-card">
      <button class="close-btn" id="closeWishBtn" aria-label="Đóng"><i class="fas fa-times"></i></button>
      <h3 id="wishTitle">Thông Điệp Gửi Em</h3>
      <div class="wish-image-container">
        <img id="wishImage" src="" alt="Hình ảnh Trung Thu">
      </div>
      <p id="wishText">"Chúc cậu một đêm Trung Thu ấm áp, bình an và trọn vẹn bên những người thương yêu."</p>
      <div class="tag">✦ Trung Thu An Lành ✦</div>
    </div>
  </div>

  <audio id="bgm" loop preload="auto" src="./1.mp3"></audio>

  <!-- Tải tuần tự để script.js luôn có THREE và OrbitControls. -->
  <script src="./three.min.js"></script>
  <script src="./OrbitControls.js"></script>
  <script src="./script.js"></script>

  <script>
    // Autoplay bị trình duyệt chặn khi chưa có thao tác. Phát ngay sau
    // lần chạm/click đầu tiên; nút nhạc vẫn dùng được như bình thường.
    (() => {
      const audio = document.getElementById('bgm');
      const audioButton = document.getElementById('audio-btn');
      if (!audio) return;

      const playAfterInteraction = () => {
        audio.play().catch(() => {});
      };

      ['pointerdown', 'touchstart', 'keydown'].forEach((eventName) => {
        window.addEventListener(eventName, playAfterInteraction, {
          once: true,
          passive: true
        });
      });

      audio.addEventListener('error', () => {
        if (audio.src.includes('/assets/')) {
          audio.src = audio.src.replace('/assets/', '/');
        }
      });

      // Đảm bảo nút nhạc luôn kích hoạt phát nhạc sau thao tác người dùng.
      audioButton?.addEventListener('click', playAfterInteraction);
    })();
  </script>
</body>
</html>
