<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trung Thu 3D</title>

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
      window.__APP_BASE__ = (() => {
        const candidates = [
          window.location.pathname.replace(/index\.html$/, '').replace(/\/+$/, '') + '/',
          './',
          '/TrungThu/',
          '/TrungThu/',
          'https://minhtc1108.github.io/TrungThu/'
        ];

        function assetExists(url) {
          try {
            const xhr = new XMLHttpRequest();
            xhr.open('HEAD', url, false);
            xhr.send();
            return xhr.status >= 200 && xhr.status < 400;
          } catch (error) {
            return false;
          }
        }

        for (const candidate of candidates) {
          const resolved = new URL('css.css', candidate.endsWith('/') ? candidate : candidate + '/').toString();
          if (assetExists(resolved)) {
            return candidate.endsWith('/') ? candidate : candidate + '/';
          }
        }

        return './';
      })();
    </script>
    <link rel="stylesheet" id="theme-css">
</head>
<body>

    <div id="webgl-container"></div>

    <div class="top-bar">
        <button class="icon-btn" id="audio-btn" title="Bật/Tắt Nhạc"><i class="fas fa-music"></i></button>
        <button class="icon-btn" id="reset-cam-btn" title="Góc nhìn ban đầu"><i class="fas fa-compress-arrows-alt"></i></button>
    </div>

    <div class="click-hint">Chạm vào lồng đèn nhé</div>

    <div class="wish-modal" id="wishModal">
        <div class="wish-card">
            <button class="close-btn" id="closeWishBtn" aria-label="Đóng"><i class="fas fa-times"></i></button>
            <h3 id="wishTitle">Thông Điệp Gửi Em</h3>
            
            <div class="wish-image-container">
                <img id="wishImage" src="" alt="Hình ảnh Trung Thu">
            </div>

            <p id="wishText">"Chúc cậu một đêm Trung Thu ấm áp, bình an và trọn vẹn bên những người thương yêu."</p>
            <div class="tag">✦ Trung Thu An Lành ✦</div>
        </div>
    </div>

    <audio id="bgm" loop src=""></audio>

    <script>
      const appBase = (() => {
        const base = window.__APP_BASE__ || './';
        return base.endsWith('/') ? base : base + '/';
      })();

      const toAbsoluteUrl = (path) => new URL(path, appBase.startsWith('http') ? appBase : window.location.origin + appBase).toString();

      document.getElementById('theme-css').setAttribute('href', toAbsoluteUrl('css.css'));
      const bgm = document.getElementById('bgm');
      bgm.src = toAbsoluteUrl('1.mp3');

      const scriptLoader = (src) => {
        const script = document.createElement('script');
        script.src = toAbsoluteUrl(src);
        document.body.appendChild(script);
      };

      scriptLoader('three.min.js');
      scriptLoader('OrbitControls.js');
      scriptLoader('script.js');
    </script>
</body>
</html>
